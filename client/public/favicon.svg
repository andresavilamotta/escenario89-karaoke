<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241d14"/>
      <stop offset="100%" stop-color="#080706"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A1"/>
      <stop offset="35%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fondo Obsidiana Cálido Redondeado -->
  <rect width="128" height="128" rx="28" fill="url(#bgGlow)"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Halo de Luz Cálida -->
  <circle cx="64" cy="56" r="32" fill="#D4AF37" opacity="0.18"/>

  <!-- Cápsula del Micrófono Vintage -->
  <rect x="46" y="24" width="36" height="52" rx="18" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  
  <!-- Rejilla Interior -->
  <rect x="49" y="27" width="30" height="46" rx="15" fill="#14120F"/>
  <line x1="64" y1="27" x2="64" y2="73" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <line x1="56" y1="29" x2="56" y2="71" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <line x1="72" y1="29" x2="72" y2="71" stroke="url(#goldGrad)" stroke-width="1.8"/>
  
  <line x1="50" y1="36" x2="78" y2="36" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="49" y1="44" x2="79" y2="44" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="49" y1="52" x2="79" y2="52" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="50" y1="60" x2="78" y2="60" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Anillo Central Metálico -->
  <rect x="44" y="47" width="40" height="6" rx="2" fill="url(#goldGrad)"/>

  <!-- Soporte en U / Arco de Suspensión -->
  <path d="M38 48 C 38 78, 90 78, 90 48" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="38" cy="48" r="3.5" fill="url(#goldGrad)"/>
  <circle cx="90" cy="48" r="3.5" fill="url(#goldGrad)"/>

  <!-- Cuello y Pedestal -->
  <rect x="60" y="76" width="8" height="18" rx="2" fill="url(#goldGrad)"/>
  <rect x="54" y="93" width="20" height="5" rx="2" fill="url(#goldGrad)"/>
  <path d="M42 104 C 42 98, 86 98, 86 104 L 92 108 C 92 112, 36 112, 36 108 Z" fill="url(#goldGrad)"/>

  <!-- Destello / Brillo Dorado Superior -->
  <path d="M96 26 L98 32 L104 34 L98 36 L96 42 L94 36 L88 34 L94 32 Z" fill="#FFF3A1" opacity="0.9"/>
  <path d="M30 38 L31.5 42 L35.5 43.5 L31.5 45 L30 49 L28.5 45 L24.5 43.5 L28.5 42 Z" fill="#FDE047" opacity="0.75"/>
</svg>
